# Compose para rodar local (Mac/arm64). Produção usa docker-compose.yml (Swarm/Traefik).
services:
  star_agents:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://star_redis:6379
      - RABBIT_URL=amqp://star_rabbitmq:5672/
      - ALERT_ENABLED=false  # não manda WhatsApp real em local
      - DEV_MODE=true
    ports:
      - 8000:8000
    depends_on:
      star_redis:
        condition: service_healthy
      star_rabbitmq:
        condition: service_healthy

  star_redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  star_rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
